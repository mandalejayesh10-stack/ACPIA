name: acpia-infra

services:
  # ─── 1. PostgreSQL 16 — Relational Database ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: acpia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acpia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acpia_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-acpia_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-acpia_admin} -d ${POSTGRES_DB:-acpia_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Neo4j 5 — Knowledge Graph Database ──────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: acpia-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/acpia_neo4j_password_2026}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - '${NEO4J_HTTP_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Redis 7 — Cache & Shared Memory ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: acpia-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-acpia_redis_password_2026}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-acpia_redis_password_2026}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 4. RabbitMQ 3 — Event Bus ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: acpia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-acpia_bus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-acpia_rabbitmq_password_2026}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 5. Qdrant — Vector Search Database ────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: acpia-qdrant
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:-6333}:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:6333/readyz || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 6. MinIO — Evidence File Storage ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-08Z
    container_name: acpia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acpia_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-acpia_minio_password_2026}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 7. Elasticsearch 8 — Full-Text Search ──────────────────────────────
  elasticsearch:
    image: elasticsearch:8.14.3
    container_name: acpia-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '${ELASTICSEARCH_PORT:-9200}:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
  elasticsearch_data:
