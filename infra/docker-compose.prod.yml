version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acpia-postgres-prod
    environment:
      POSTGRES_DB: acpia_prod
      POSTGRES_USER: acpia_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123!}
    ports:
      - '5432:5432'
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: acpia-redis-prod
    ports:
      - '6379:6379'
    restart: always

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: acpia-qdrant-prod
    ports:
      - '6333:6333'
    volumes:
      - qdrantdata_prod:/qdrant/storage
    restart: always

  neo4j:
    image: neo4j:5-community
    container_name: acpia-neo4j-prod
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-SecretNeo4jPassword!}
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4jdata_prod:/data
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: acpia-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-SecretMinioPassword!}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata_prod:/data
    restart: always

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: acpia-api-prod
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - minio
    restart: always

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: acpia-web-prod
    ports:
      - '80:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api
    restart: always

volumes:
  pgdata_prod:
  qdrantdata_prod:
  neo4jdata_prod:
  miniodata_prod:
